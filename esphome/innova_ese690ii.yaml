################################################################################
# Innova ESE690II Fancoil Controller — ESPHome Modbus Integration
#
# Wiring (ESP32 + MAX485):
#   ESP32 TX  → MAX485 DI
#   ESP32 RX  → MAX485 RO
#   ESP32 GPIO (de_pin) → MAX485 DE + RE (tied together)
#   MAX485 A  → RS-485 A (D+)
#   MAX485 B  → RS-485 B (D-)
#
# Edit the substitutions below and flash to your device.
################################################################################

substitutions:
  device_name: innova-fancoil
  friendly_name: "Innova ESE690II"
  modbus_id: innova_modbus
  slave_address: "1"

  # UART pins — adjust for your wiring
  uart_tx_pin: GPIO17
  uart_rx_pin: GPIO16
  uart_de_pin: GPIO4        # MAX485 DE/RE pin; remove uart_de_pin usage below if wired always-receive

  uart_baud_rate: "9600"
  uart_parity: EVEN         # Innova default

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  baud_rate: 0              # disable UART logger so it doesn't clash

api:
  encryption:
    key: !secret api_key

ota:
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name} Fallback"
    password: !secret fallback_password

captive_portal:

################################################################################
# Modbus
################################################################################

uart:
  id: modbus_uart
  tx_pin: ${uart_tx_pin}
  rx_pin: ${uart_rx_pin}
  baud_rate: ${uart_baud_rate}
  parity: ${uart_parity}
  data_bits: 8
  stop_bits: 1

modbus:
  id: ${modbus_id}
  uart_id: modbus_uart
  # flow_control_pin: ${uart_de_pin}   # Uncomment if using DE/RE pin

modbus_controller:
  - id: innova_ctrl
    modbus_id: ${modbus_id}
    address: ${slave_address}
    update_interval: 10s
    # ESPHome retries failed reads automatically; lower interval if needed.

################################################################################
# Sensors — add confirmed registers here
#
# Template:
#   - platform: modbus_controller
#     modbus_controller_id: innova_ctrl
#     name: "Register Name"
#     register_type: holding          # holding | input | coil | discrete_input
