#     unit_of_measurement: "°C"
#     accuracy_decimals: 1
#     filters:
#       - multiply: 0.1               # e.g. if raw value is in tenths of a degree
################################################################################

sensor:
  # ── Add confirmed input / holding register sensors below ──────────────────
